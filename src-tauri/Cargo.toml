[package]
name = "comic-reader"
version = "0.2.4"
description = "漫畫壓縮檔閱讀器"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "comic_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-androidbridge = { path = "plugins/tauri-plugin-androidbridge" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
sevenz-rust = { version = "0.6", features = ["aes256"] }
unrar = "0.5"
base64 = "0.22"
natord = "1.0"
encoding_rs = "0.8"
chardetng = "0.1"
epub = "2"
mobi = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "http2"] }
scraper = "0.24"
ego-tree = "0.10"
url = "2"
# 自建 rustls 設定灌入 webpki 根憑證；Android 上 rustls-platform-verifier 未初始化會 panic
rustls = "0.23"
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# unrar_sys 0.5.8 的 build.rs 用 cfg!(windows) 判斷主機而非目標平台，
# 從 Windows 交叉編譯 Android 會失敗；vendor 修正版改判斷 CARGO_CFG_TARGET_OS
[patch.crates-io]
unrar_sys = { path = "vendor/unrar_sys" }
