name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # gen/android 已入庫；若未入庫請改為執行 npx tauri android init
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload-keystore.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF

      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: npx tauri android build --apk

      - name: Rename APK
        run: |
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             out/ComicReaderM-${{ github.ref_name }}.apk

      # 從 CHANGELOG.md 取出本版段落（## vX.Y.Z 到下一個 ## 之前）當 Release 說明
      - name: Release notes
        run: |
          awk -v tag="## ${{ github.ref_name }}" '
            index($0, tag) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md 2>/dev/null || true
          {
            echo "### 更新內容"
            if [ -s notes.md ]; then cat notes.md; else echo "- 小幅修正與改進"; fi
            echo
            echo "Android APK（arm64 / armv7 / x86_64 universal）。"
            echo "App 內「檢查更新」會偵測此版本並引導下載。"
          } > release-body.md
          cat release-body.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "漫畫閱讀器 Android ${{ github.ref_name }}"
          files: out/*.apk
          body_path: release-body.md
